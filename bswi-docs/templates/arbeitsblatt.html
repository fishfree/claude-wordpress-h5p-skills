<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITEL}} – BS:WI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap');
        
        :root {
            --bswi-blau-1: #1C3D71;
            --bswi-blau-2: #102141;
            --bswi-blau-3: #1266B0;
            --bswi-blau-4: #008BC9;
            --bswi-blau-5: #41C0F0;
            --bswi-blau-6: #A4DBF8;
            --bswi-blau-7: #EAF6FE;
            --bswi-akzent: #E8FF00;
            --bswi-schwarz: #000000;
            --bswi-dunkelgrau: #666666;
            --bswi-hellgrau: #F6F6F6;
            --page-padding: 10mm;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.55;
            color: var(--bswi-schwarz);
            background: #e8e8e8;
        }
        
        .bswi-document {
            max-width: 210mm;
            min-height: 297mm;
            margin: 10mm auto;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }
        
        /* ===== HEADER ===== */
        .bswi-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 5mm var(--page-padding);
            border-bottom: 2.5px solid var(--bswi-blau-1);
            background: linear-gradient(180deg, var(--bswi-blau-7) 0%, #fff 100%);
        }
        
        .bswi-logo { height: 32px; width: auto; }
        .bswi-header-center { text-align: center; }
        .bswi-title { font-size: 15pt; font-weight: 700; color: var(--bswi-blau-1); margin: 0; line-height: 1.2; }
        .bswi-subtitle { font-size: 10pt; font-weight: 500; color: var(--bswi-blau-3); margin-top: 3px; }
        
        /* Header rechts: Name/Datum Feld */
        .bswi-header-right { text-align: right; font-size: 9pt; color: var(--bswi-dunkelgrau); }
        .bswi-header-field { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; margin-bottom: 6px; }
        .bswi-header-field:last-child { margin-bottom: 0; }
        .bswi-header-label { font-size: 9pt; color: var(--bswi-dunkelgrau); }
        .bswi-header-input { border-bottom: 1px solid var(--bswi-dunkelgrau); min-width: 90px; height: 1.3em; }
        
        /* ===== CONTENT ===== */
        .bswi-content { flex: 1; padding: var(--page-padding); }
        .bswi-content h1 { font-size: 13pt; font-weight: 700; color: var(--bswi-blau-1); margin: 1.3em 0 0.5em 0; padding-bottom: 4px; border-bottom: 2px solid var(--bswi-blau-5); }
        .bswi-content h1:first-child { margin-top: 0; }
        .bswi-content h2 { font-size: 11.5pt; font-weight: 700; color: var(--bswi-blau-1); margin: 1em 0 0.4em 0; }
        .bswi-content p { margin: 0 0 0.8em 0; }
        .bswi-content ul, .bswi-content ol { margin: 0 0 0.8em 1.5em; }
        .bswi-content li { margin-bottom: 0.3em; }
        .bswi-content strong { font-weight: 700; color: var(--bswi-blau-1); }
        .bswi-content a { color: var(--bswi-blau-4); text-decoration: none; }
        .bswi-content a:hover { text-decoration: underline; }
        
        /* ===== AUFGABEN-BOX ===== */
        .bswi-task { background: var(--bswi-hellgrau); border: 2px solid var(--bswi-blau-4); border-radius: 8px; padding: 14px 16px; margin: 1.2em 0; }
        .bswi-task-header { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--bswi-blau-1); margin-bottom: 10px; font-size: 11.5pt; }
        .bswi-task-header::before { content: "📝"; font-size: 14pt; }
        .bswi-task p:last-child { margin-bottom: 0; }
        
        /* ===== INFO-BOX ===== */
        .bswi-info { background: var(--bswi-blau-7); border-left: 4px solid var(--bswi-blau-4); padding: 12px 14px; margin: 1em 0; border-radius: 0 8px 8px 0; }
        
        /* ===== WARNUNG-BOX ===== */
        .bswi-warning { background: #FFFDE7; border-left: 4px solid var(--bswi-akzent); padding: 12px 14px; margin: 1em 0; border-radius: 0 8px 8px 0; }
        
        /* ===== EINGABEZEILE ===== */
        .bswi-input-line { border-bottom: 1.5px solid var(--bswi-dunkelgrau); min-height: 2em; margin: 8px 0; }
        .bswi-input-line.short { width: 50%; }
        .bswi-input-line.inline { width: 80px; display: inline-block; margin: 0 4px; vertical-align: bottom; }
        
        /* ===== TABELLE ===== */
        .bswi-content table { width: 100%; border-collapse: collapse; margin: 1em 0; }
        .bswi-content th { background: var(--bswi-blau-1); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 10.5pt; }
        .bswi-content td { padding: 10px 12px; border-bottom: 1px solid var(--bswi-blau-6); }
        .bswi-content tr:nth-child(even) { background: var(--bswi-blau-7); }
        
        /* ===== FORMEL ===== */
        .formula { font-family: 'Times New Roman', serif; font-style: italic; font-size: 12pt; background: var(--bswi-blau-7); padding: 8px 12px; border-radius: 4px; display: inline-block; margin: 4px 0; }
        
        /* ===== FOOTER (Hell) ===== */
        .bswi-footer {
            padding: 3mm var(--page-padding);
            border-top: 2px solid var(--bswi-blau-1);
            background: #fff;
            font-size: 8.5pt;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--bswi-dunkelgrau);
        }
        
        .bswi-footer-claim {
            font-weight: 600;
            font-style: italic;
            color: var(--bswi-blau-3);
        }
        
        /* ===== PRINT ===== */
        @media print {
            body { background: none; }
            .bswi-document { box-shadow: none; margin: 0; max-width: none; min-height: auto; }
            .bswi-header { background: var(--bswi-blau-7); }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>
<div class="bswi-document">
    <header class="bswi-header">
        <svg class="bswi-logo" viewBox="0 0 692.7 566.9" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="399.7" y1="366.2" x2="1258.5" y2="80.8" gradientUnits="userSpaceOnUse"><stop offset="0.3" stop-color="#41C0F0"/><stop offset="0.4" stop-color="#A4DBF8"/></linearGradient>
                <linearGradient id="g2" x1="212.7" y1="462.7" x2="-54.8" y2="242.1" gradientUnits="userSpaceOnUse"><stop offset="0.3" stop-color="#067AA7"/><stop offset="0.6" stop-color="#41C0F0"/><stop offset="1" stop-color="#A4DBF8"/></linearGradient>
                <linearGradient id="g3" x1="241.1" y1="340.2" x2="423.9" y2="424.6" gradientUnits="userSpaceOnUse"><stop offset="0.1" stop-color="#067AA7"/><stop offset="0.3" stop-color="#41C0F0"/><stop offset="1" stop-color="#A4DBF8"/></linearGradient>
                <linearGradient id="g4" x1="515.2" y1="15.2" x2="280.7" y2="716.7" gradientUnits="userSpaceOnUse"><stop offset="0.1" stop-color="#0E66AF"/><stop offset="0.7" stop-color="#1B3D71"/></linearGradient>
            </defs>
            <path d="M689.4 0 616.1 18.8C603.2 22.1 593.8 31.7 590.4 44.5L450.2 566.9 624.9 566.9 689.4 0Z" fill="url(#g1)"/>
            <path d="M156.2 136.4 29.8 168.7C13.7 172.9 0 189.5 0 206.2L0 567 156.2 567 156.2 136.4Z" fill="url(#g2)"/>
            <path d="M220.5 566.9 385.9 566.9 369.5 163.2 248.5 194.2 220.5 566.9Z" fill="url(#g3)"/>
            <path d="M248.5 194.2 0 566.9 156.2 566.9 369.5 163.2 248.4 194.2ZM460.2 58.7 220.5 567 385.9 567 559.5 33.3 460.2 58.7ZM680 157.5 586.1 60.7 450.3 567 661.6 567 692.6 185.5C693.6 173 689.1 167 680 157.6Z" fill="url(#g4)"/>
        </svg>
        
        <div class="bswi-header-center">
            <h1 class="bswi-title">{{TITEL}}</h1>
            <p class="bswi-subtitle">{{UNTERTITEL}}</p>
        </div>
        
        <div class="bswi-header-right">
            <div class="bswi-header-field">
                <span class="bswi-header-label">Name:</span>
                <span class="bswi-header-input"></span>
            </div>
            <div class="bswi-header-field">
                <span class="bswi-header-label">Datum:</span>
                <span class="bswi-header-input"></span>
            </div>
        </div>
    </header>
    
    <main class="bswi-content">
        <!-- INHALT HIER EINFÜGEN -->
    </main>
    
    <footer class="bswi-footer">
        <div>Dirk Schulenburg · BS:WI</div>
        <div class="bswi-footer-claim">Kompetent Zukunft Gestalten</div>
    </footer>
</div>
</body>
</html>
