<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>[TITEL] - Arbeitsblatt</title>
    <style>
        @page { size: A4; margin: 1.5cm; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 10pt;
            line-height: 1.5;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #003366;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .header h1 { color: #003366; font-size: 13pt; margin: 0; }
        h2 { color: #003366; font-size: 11pt; margin: 20px 0 10px 0; }
        h3 { color: #0077b6; font-size: 10pt; margin: 15px 0 8px 0; }

        /* Eingabefelder */
        input[type="text"] {
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 4px 6px;
            font-size: 10pt;
            background: #fffef0;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0077b6;
            background: #fff;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 8px;
            font-size: 10pt;
            resize: vertical;
            background: #fffef0;
        }
        textarea:focus {
            outline: none;
            border-color: #0077b6;
            background: #fff;
        }
        .name-input {
            border: none;
            border-bottom: 1px solid #333;
            background: transparent;
            width: 150px;
            font-size: 9pt;
        }

        /* Tabellen */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 8px;
            text-align: center;
        }
        th {
            background: #003366;
            color: white;
            font-weight: bold;
        }
        td:first-child {
            text-align: left;
            background: #f8f9fa;
        }
        .input-cell {
            background: white;
            padding: 3px;
        }
        .input-cell input[type="text"] {
            width: 90%;
        }
        .result-row td {
            background: #e8f4f8;
            font-weight: bold;
        }
        .final-row td {
            background: #003366;
            color: white;
            font-weight: bold;
        }

        /* Info-Boxen */
        .info-box {
            background: #e8f4f8;
            border-left: 4px solid #0077b6;
            padding: 10px;
            margin: 10px 0;
            font-size: 9pt;
        }
        .tip-box {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 10px;
            margin: 10px 0;
            font-size: 9pt;
        }
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin: 10px 0;
            font-size: 9pt;
        }

        /* Aufgaben-Box */
        .aufgaben-box {
            background: #e8f4f8;
            border: 1px solid #0077b6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .aufgaben-box h3 {
            color: #0077b6;
            margin: 0 0 10px 0;
        }

        /* Page Sections für Print */
        .page-section {
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 8pt;
            color: #666;
            text-align: center;
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            body {
                padding: 0;
                margin: 0 auto;
                max-width: none;
            }

            .page-section.page-break-after {
                page-break-after: always;
            }

            /* Farben erhalten */
            th, .info-box, .tip-box, .warning-box, .aufgaben-box,
            .result-row td, .final-row td {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* Eingabefelder für Print */
            input[type="text"], textarea {
                border: none !important;
                border-bottom: 1px solid #333 !important;
                background: transparent !important;
            }
            .name-input {
                border-bottom: 1px solid #333 !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>[TITEL]</h1>
        <div style="text-align: right; font-size: 9pt; color: #666;">
            [LF] [LS] | Station [N]<br>
            Name: <input type="text" class="name-input" placeholder="">
        </div>
    </div>

    <div class="info-box">
        <strong>Aufgabe:</strong> [AUFGABENBESCHREIBUNG]
    </div>

    <!-- Schritt 1 -->
    <div class="page-section page-break-after">
        <h2>Schritt 1: [TITEL]</h2>

        <table>
            <tr>
                <th style="width: 40%;">Position</th>
                <th style="width: 30%;">Wert A</th>
                <th style="width: 30%;">Wert B</th>
            </tr>
            <tr>
                <td>Zeile 1</td>
                <td class="input-cell"><input type="text" placeholder=""></td>
                <td class="input-cell"><input type="text" placeholder=""></td>
            </tr>
            <tr>
                <td>Zeile 2</td>
                <td class="input-cell"><input type="text" placeholder=""></td>
                <td class="input-cell"><input type="text" placeholder=""></td>
            </tr>
            <tr class="result-row">
                <td>Ergebnis</td>
                <td class="input-cell"><input type="text" placeholder=""></td>
                <td class="input-cell"><input type="text" placeholder=""></td>
            </tr>
        </table>

        <div class="tip-box">
            <strong>Tipp:</strong> [HILFESTELLUNG]
        </div>
    </div>

    <!-- Schritt 2 -->
    <div class="page-section">
        <h2>Schritt 2: [TITEL]</h2>

        <div class="aufgaben-box">
            <h3>Ihre Aufgaben</h3>
            <ol>
                <li>Aufgabe 1</li>
                <li>Aufgabe 2</li>
                <li>Aufgabe 3</li>
            </ol>
        </div>

        <h3>Ihre Lösung</h3>
        <textarea placeholder="Begründen Sie Ihre Entscheidung..."></textarea>
    </div>

    <div class="footer">
        [LF] [LS] | [THEMA] | [STATION]
    </div>
</body>
</html>
